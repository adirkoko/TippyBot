<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#101417">
    <title>Dashboard · TippyBot</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body data-page="dashboard">
    <header class="site-header">
      <div class="brand-block">
        <div class="brand-mark small" aria-hidden="true">T</div>
        <div>
          <p class="eyebrow">TippyBot Console</p>
          <h1>Dashboard</h1>
        </div>
      </div>
      <nav class="top-nav" aria-label="Main navigation">
        <a class="nav-link is-active" href="/" aria-current="page">Dashboard</a>
        <a class="nav-link" href="/logs">Logs</a>
        <a class="nav-link" href="/bots">Bots</a>
      </nav>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
        </button>
        <span id="dashboard-stream-state" class="stream-state is-idle" aria-live="polite">
          <span class="state-dot" aria-hidden="true"></span>
          Loading data…
        </span>
        <button id="logout-button" class="icon-button" type="button" aria-label="Sign out" title="Sign out">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H8"></path></svg>
        </button>
      </div>
    </header>

    <main class="dashboard-shell">
      <section aria-labelledby="dashboard-heading">
        <div class="dashboard-heading">
          <div>
            <p class="eyebrow">Instance overview</p>
            <h2 id="dashboard-heading">Bot status</h2>
          </div>
          <p id="dashboard-summary" class="dashboard-summary" aria-live="polite">
            Loading instance status…
          </p>
        </div>

        <div id="dashboard-grid" class="dashboard-grid" aria-busy="true"></div>
        <div id="dashboard-empty" class="dashboard-empty" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg class="icon icon-lg" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M9 7V5a3 3 0 0 1 6 0v2M8 12h.01M16 12h.01M9 16h6"></path></svg>
          </div>
          <h3>No bot instances to display</h3>
          <p>BotManager does not currently have any managed instances.</p>
        </div>
      </section>
    </main>
  </body>
</html>
